  <style>
    @font-face {
      font-family: 'CoFo Sans Mono Trial';
      src: url('CoFoSansMono-Regular-Trial.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    :root {
      --font: 'CoFo Sans Mono Trial', monospace;
      --bg: #fffbf6;
      --text: #000;
      --fs: 20px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: var(--font);
      font-size: var(--fs);
      font-weight: 400;
      color: var(--text);
    }

    /* Fixed header nav */
    .nav {
      position: fixed;
      top: 22px;
      z-index: 20;
      white-space: nowrap;
      line-height: normal;
    }
    .nav-title    { left: 22px; }
    .nav-country  { left: 243px; }
    .nav-gallery  { left: 416px; }

    /* Horizontal gallery strip — bottom-aligned */
    .gallery {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 88vh;
      display: flex;
      align-items: flex-end;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .gallery::-webkit-scrollbar { display: none; }

    .gallery img {
      display: block;
      flex-shrink: 0;
      width: auto;
    }
    .gallery img.landscape { height: 54vh; }
    .gallery img.portrait  { height: 88vh; }

    .gallery .photo-wrap { position: relative; flex-shrink: 0; }
    .gallery .photo-wrap img { display: block; }
    .gallery .photo-num { display: none; 
      position: absolute; top: 8px; left: 8px;
      background: rgba(0,0,0,0.6); color: #fff;
      font-size: 14px; line-height: 1; padding: 4px 7px;
      border-radius: 4px; pointer-events: none; z-index: 5;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255, 251, 246, 0.9);
      z-index: 100;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active { display: flex; }
    .modal-overlay.visible { opacity: 1; }

    .modal-text-col {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-info {
      font-family: var(--font);
      font-size: 20px;
      color: #000;
      line-height: normal;
      width: 250px;
    }

    .modal-photo-wrap {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .modal-img {
      display: block;
      max-height: 88vh;
      max-width: 60vw;
      object-fit: contain;
    }

    .modal-spacer {
      flex: 1;
      min-width: 0;
    }

    .photo-wrap { cursor: pointer; }

    /* Loader */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font);
      font-size: 20px;
      color: var(--text);
    }
  </style>
</head>

  <script>
    const gallery = document.getElementById('gallery');
    gallery.addEventListener('wheel', function(e) {
      e.preventDefault();
      gallery.scrollLeft += (e.deltaY + e.deltaX) * 0.6;
    }, { passive: false });
  </script>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-text-col">
      <div class="modal-info" id="modal-info"></div>
    </div>
    <div class="modal-photo-wrap" id="modal-photo-wrap">
      <img class="modal-img" id="modal-img" src="" alt="">
    </div>
    <div class="modal-spacer"></div>
  </div>

  <script>
    // gallery already declared above
    const modal    = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');
    const modalInfo= document.getElementById('modal-info');

    const wraps = [...document.querySelectorAll('.photo-wrap')];
    let current = 0;

    function openModal(index) {
      current = index;
      showPhoto();
      modal.classList.add('active');
      requestAnimationFrame(() => requestAnimationFrame(() => modal.classList.add('visible')));
    }

    function showPhoto() {
      const wrap = wraps[current];
      const img  = wrap.querySelector('img');
      modalImg.src = img.src;
      modalImg.style.maxHeight = img.classList.contains('portrait') ? '88vh' : '65vh';
      const name   = wrap.dataset.name   || '';
      const coords = wrap.dataset.coords || '';
      modalInfo.innerHTML = name + '<br>' + coords;
    }

    function closeModal() {
      modal.classList.remove('visible');
      setTimeout(() => modal.classList.remove('active'), 300);
    }

    function prev() { current = (current - 1 + wraps.length) % wraps.length; showPhoto(); }
    function next() { current = (current + 1) % wraps.length; showPhoto(); }

    // Open on photo click
    wraps.forEach((wrap, i) => wrap.addEventListener('click', () => openModal(i)));

    // Close on overlay click (not on photo or arrows)
    modal.addEventListener('click', function(e) {
      if (e.target === modal) closeModal();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();
      if (!modal.classList.contains('active')) return;
      if (e.key === 'ArrowLeft')  prev();
      if (e.key === 'ArrowRight') next();
      if (e.key === 'Escape')     closeModal();
    });
  </script>

  <script>
    // Loader
    const loader = document.getElementById('loader');
    const images = [...document.querySelectorAll('.gallery img')];
    let loaded = 0;
    const total = images.length;

    function onLoad() {
      loaded++;
      const pct = Math.round((loaded / total) * 100);
      loader.textContent = pct + '%';
      if (loaded >= total) {
        setTimeout(() => {
          loader.style.transition = 'opacity 0.4s';
          loader.style.opacity = '0';
          setTimeout(() => loader.style.display = 'none', 400);
          startAudio();
        }, 200);
      }
    }

    images.forEach(img => {
      if (img.complete) onLoad();
      else { img.addEventListener('load', onLoad); img.addEventListener('error', onLoad); }
    });

    // Audio
    const audio = document.getElementById('bg-audio');
    const soundBtn = document.getElementById('sound-btn');
    const iconOn  = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 9H7L12 4V20L7 15H3V9Z" fill="black"/><path d="M15.5 8.5C16.5 9.5 17 10.7 17 12C17 13.3 16.5 14.5 15.5 15.5" stroke="black" stroke-width="1.5" stroke-linecap="round"/><path d="M18.5 5.5C20.4 7.4 21.5 9.6 21.5 12C21.5 14.4 20.4 16.6 18.5 18.5" stroke="black" stroke-width="1.5" stroke-linecap="round"/></svg>`;
    const iconOff = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 9H7L12 4V20L7 15H3V9Z" fill="black"/><line x1="16" y1="9" x2="22" y2="15" stroke="black" stroke-width="1.5" stroke-linecap="round"/><line x1="22" y1="9" x2="16" y2="15" stroke="black" stroke-width="1.5" stroke-linecap="round"/></svg>`;
    let audioStarted = false;
    let muted = true;
    audio.muted = true;

    function startAudio() {
      if (audioStarted) return;
      audio.play().then(() => { audioStarted = true; }).catch(() => {});
    }

    function toggleSound() {
      if (!audioStarted) {
        audio.muted = false;
        audio.play().then(() => { audioStarted = true; }).catch(() => {});
        muted = false;
      } else {
        muted = !muted;
        audio.muted = muted;
      }
      soundBtn.innerHTML = muted ? iconOff : iconOn;
    }
  </script>
</body>
